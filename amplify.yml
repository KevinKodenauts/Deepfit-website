version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # Vite inlines this at build time. Fallback is the web OAuth client used by the app.
        - export VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID:-12274574025-rkmdk3h8jr7egmnb24ht5722qdvgt0hc.apps.googleusercontent.com}"
        - npm run build
  artifacts:
    # Nitro aws_amplify preset writes Amplify Hosting Compute output here
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
